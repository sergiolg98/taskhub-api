spring.application.name=task-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_db}
spring.datasource.username=${DB_USER:taskhub}
spring.datasource.password=${DB_PASSWORD:taskhub}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8082

# JWT: validation only. Same plain-text secret as auth-service (min 32 bytes), from the environment.
app.jwt.secret=${JWT_SECRET}

# Notification strategy used when a task is created: log | email
taskhub.notifications.type=log
