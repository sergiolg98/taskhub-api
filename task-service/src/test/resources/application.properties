spring.datasource.url=jdbc:h2:mem:taskdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=test-secret-for-jwt-tests-must-be-at-least-32-bytes-long

# Tests do not depend on the config server.
spring.cloud.config.enabled=false
spring.config.import=

# Not called: these tests replace UserLookupPort. OwnerVerificationTest overrides the URL with a fake auth-service.
taskhub.auth-service.url=http://localhost:1

# Resilience for tests: small numbers so a test can trip the breaker in a few calls (production values live in config-repo).
resilience4j.retry.instances.authService.max-attempts=2
resilience4j.retry.instances.authService.wait-duration=10ms
resilience4j.retry.instances.authService.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,com.taskhub.task.infrastructure.lookup.AuthRejectedException
resilience4j.retry.instances.authService.retry-exceptions=com.taskhub.task.infrastructure.lookup.ExternalServiceException
resilience4j.circuitbreaker.instances.authService.sliding-window-size=4
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=1s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.authService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.authService.record-exceptions=com.taskhub.task.infrastructure.lookup.ExternalServiceException
resilience4j.circuitbreaker.instances.authService.register-health-indicator=false
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
