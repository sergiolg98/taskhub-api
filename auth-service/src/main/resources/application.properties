spring.application.name=taskhub

# Local development: load variables from .env (git-ignored) when running from the project root
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskhub}
spring.datasource.username=${DB_USER:taskhub}
spring.datasource.password=${DB_PASSWORD:taskhub}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8080

# JWT: the secret comes from the environment (plain text, min 32 bytes). Never in the repo.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=5

# Notification strategy used when a task is created: log | email
taskhub.notifications.type=log
