spring.application.name=auth-service

# Local development: load variables from .env (git-ignored), from the project root or from this module
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db}
spring.datasource.username=${DB_USER:taskhub}
spring.datasource.password=${DB_PASSWORD:taskhub}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8081

# JWT: the secret comes from the environment (plain text, min 32 bytes). Never in the repo.
# task-service validates tokens with the SAME secret (shared HMAC key), so both read JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=5
