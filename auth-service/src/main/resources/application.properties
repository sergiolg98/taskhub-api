spring.application.name=auth-service

# Configuration lives in config-repo (served by config-server). Without "optional:" the service would refuse to start
# when the config server is down; with it, the service starts with the local fallbacks below.
# The .env files (git-ignored, project root or this module) give local development its secrets, e.g. JWT_SECRET.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Secrets and credentials never go to config-repo: they come from the environment of each service.
spring.datasource.username=${DB_USER:taskhub}
spring.datasource.password=${DB_PASSWORD:taskhub}
app.jwt.secret=${JWT_SECRET}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Fallbacks, used only when the config server cannot be reached. The values served by the config server win over them.
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
app.jwt.expiration-minutes=5
