spring.application.name=api-gateway

# Routes, CORS and timeouts live in config-repo (api-gateway*.properties). A gateway without routes is useless,
# so unlike the business services it has no local fallback for them.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
