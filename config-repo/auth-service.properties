# Shared by every profile of auth-service. NO secrets here: JWT_SECRET, DB_USER and DB_PASSWORD come from the environment of each service.
server.port=8081
spring.datasource.hikari.connection-timeout=30000
logging.level.root=INFO
app.jwt.expiration-minutes=5

# Actuator: only /actuator/health is exposed (Docker healthcheck, class 12)
management.endpoints.web.exposure.include=health
