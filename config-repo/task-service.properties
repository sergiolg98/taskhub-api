# Shared by every profile of task-service. NO secrets here: JWT_SECRET, DB_USER and DB_PASSWORD come from the environment of each service.
server.port=8082
spring.datasource.hikari.connection-timeout=30000
logging.level.root=INFO
# Notification strategy used when a task is created: log | email
taskhub.notifications.type=log

# Calls to auth-service (OpenFeign). Fail fast: a slow auth-service must not hold task-service threads for long.
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000

# Resilience around the call to auth-service (instance "authService"). Order: Retry( CircuitBreaker( call ) ).
# Worst case for one lookup while auth hangs: 2 attempts x 2 s read timeout + 300 ms wait = about 4.3 s, and the breaker opens soon after.
resilience4j.retry.instances.authService.max-attempts=2
resilience4j.retry.instances.authService.wait-duration=300ms
# an open circuit or a 4xx must not be retried
resilience4j.retry.instances.authService.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,com.taskhub.task.infrastructure.lookup.AuthRejectedException
resilience4j.retry.instances.authService.retry-exceptions=com.taskhub.task.infrastructure.lookup.ExternalServiceException

resilience4j.circuitbreaker.instances.authService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.authService.automatic-transition-from-open-to-half-open-enabled=true
# only real failures count; 404 (user does not exist) and 4xx rejections are answers from a healthy service
resilience4j.circuitbreaker.instances.authService.record-exceptions=com.taskhub.task.infrastructure.lookup.ExternalServiceException
# a breaker in OPEN must not turn task-service's own /actuator/health DOWN (it would restart healthy containers)
resilience4j.circuitbreaker.instances.authService.register-health-indicator=false

# Actuator: health is public (Docker healthchecks, class 12); the rest needs ADMIN (see SecurityConfig).
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
