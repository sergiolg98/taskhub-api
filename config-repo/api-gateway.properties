# Shared by every profile of api-gateway. The service URLs and the allowed origins come from the profile files.
server.port=8080
logging.level.root=INFO

# Routes: the first predicate that matches wins. Paths are NOT rewritten: the services expose the same paths as the gateway.
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${taskhub.auth-service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/users/**,/admin/users/**
spring.cloud.gateway.server.webflux.routes[1].id=task-service
spring.cloud.gateway.server.webflux.routes[1].uri=${taskhub.task-service.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/tasks/**,/admin/tasks/**

# Timeouts towards the services: fail fast instead of hanging the client.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# CORS lives ONLY here (never also in the services, or the browser receives duplicated headers).
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${taskhub.gateway.allowed-origins}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,X-Request-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Request-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# Paths that do not need an Authorization header at the gateway (everything else is rejected with 401 before routing)
taskhub.gateway.public-paths=/auth/**

# Actuator: only /actuator/health is exposed (Docker healthcheck, class 12)
management.endpoints.web.exposure.include=health
