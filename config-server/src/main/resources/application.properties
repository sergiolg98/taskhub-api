spring.application.name=config-server
server.port=8888

# "native" backend: reads plain files from a folder. Git is the production variant (spring.cloud.config.server.git.uri).
spring.profiles.active=native
# Relative to the folder the server starts in (config-server/). Override with CONFIG_REPO_PATH when launching from elsewhere.
spring.cloud.config.server.native.search-locations=file:${CONFIG_REPO_PATH:../config-repo}

# Actuator: only /actuator/health is exposed (Docker healthcheck, class 12)
management.endpoints.web.exposure.include=health
