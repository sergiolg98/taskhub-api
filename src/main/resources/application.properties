spring.application.name=taskhub

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskhub}
spring.datasource.username=${DB_USER:taskhub}
spring.datasource.password=${DB_PASSWORD:taskhub}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8080
